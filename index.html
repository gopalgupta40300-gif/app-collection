<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f1a;
      --surface: #141629;
      --card: #1b1e35;
      --card-hover: #212540;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.15);
      --text: #e8eaf6;
      --muted: #8b90b8;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --accent3: #ff6b8a;
      --pill-bg: rgba(108,99,255,0.12);
      --pill-text: #9d97ff;
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    body.light {
      --bg: #f0f2ff;
      --surface: #ffffff;
      --card: #ffffff;
      --card-hover: #f5f6ff;
      --border: rgba(108,99,255,0.15);
      --border-hover: rgba(108,99,255,0.35);
      --text: #1a1c2e;
      --muted: #6b6f9a;
      --accent: #5046e5;
      --accent2: #00b896;
      --accent3: #e0355a;
      --pill-bg: rgba(80,70,229,0.08);
      --pill-text: #5046e5;
      --shadow: 0 4px 20px rgba(80,70,229,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ---- HEADER ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .theme-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ---- LAYOUT ---- */
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      padding: 24px 28px;
      max-width: 1400px;
    }
    .main {}
    .sidebar {}

    /* ---- SECTION ---- */
    .section { margin-bottom: 28px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .section-title .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .add-btn {
      background: var(--pill-bg);
      color: var(--pill-text);
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-btn:hover { opacity: 0.8; }

    /* ---- GRID ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), border-color 0.2s, background 0.2s;
      text-align: center;
      padding: 10px 8px;
      gap: 8px;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(108,99,255,0.06), rgba(0,212,170,0.04));
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover::before { opacity: 1; }
    .card:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--border-hover);
      background: var(--card-hover);
      box-shadow: var(--shadow);
    }
    .card img {
      width: 38px;
      height: 38px;
      border-radius: 8px;
    }
    .card-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .remove-btn {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent3);
      border: none;
      color: white;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .remove-btn { opacity: 1; }

    /* ---- SIDEBAR ---- */
    .sidebar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .sidebar-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ---- TASKS ---- */
    .task-input-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .task-input-wrap input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .task-input-wrap input:focus { border-color: var(--accent); }
    .task-input-wrap input::placeholder { color: var(--muted); }
    .task-add-btn {
      background: var(--accent);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .task-add-btn:hover { opacity: 0.85; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }
    .task-item:hover { border-color: var(--border-hover); }
    .task-check {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-hover);
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .task-check.done {
      background: var(--accent2);
      border-color: var(--accent2);
    }
    .task-check.done::after {
      content: '✓';
      color: white;
      font-size: 11px;
      font-weight: 700;
    }
    .task-text {
      flex: 1;
      font-size: 13px;
      color: var(--text);
      transition: all 0.2s;
    }
    .task-text.done { text-decoration: line-through; color: var(--muted); }
    .task-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.2s;
      line-height: 1;
    }
    .task-del:hover { color: var(--accent3); }

    /* ---- STATS MINI ---- */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
    }
    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }

    /* ---- CLOCK ---- */
    .clock-wrap {
      text-align: center;
      padding: 4px 0 8px;
    }
    .clock {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    .date-str { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 500; }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; padding: 16px; }
      .sidebar { order: -1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div>
        <div class="logo-text">StudyHub</div>
        <div class="logo-sub">Your learning command center</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span> <span id="themeLabel">Light</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- MAIN -->
    <div class="main">

      <!-- Custom -->
      <div class="section" id="customSection" style="display:none">
        <div class="section-header">
          <div class="section-title"><span class="dot" style="background:var(--accent3)"></span> My Bookmarks</div>
        </div>
        <div class="grid" id="customGrid"></div>
      </div>

      <!-- AI -->
      <div class="section">
        <div class="section-header">
          <div class="section-title"><span class="dot" style="background:#6c63ff"></span> Search & AI</div>
          <button class="add-btn" onclick="addWebpage()">+ Add site</button>
        </div>
        <div class="grid" id="aiGrid"></div>
      </div>

      <!-- Dev -->
      <div class="section">
        <div class="section-header">
          <div class="section-title"><span class="dot" style="background:#00d4aa"></span> Dev & Code</div>
        </div>
        <div class="grid" id="devGrid"></div>
      </div>

      <!-- Learn -->
      <div class="section">
        <div class="section-header">
          <div class="section-title"><span class="dot" style="background:#f7c948"></span> Learning & Internships</div>
        </div>
        <div class="grid" id="learnGrid"></div>
      </div>

      <!-- Career -->
      <div class="section">
        <div class="section-header">
          <div class="section-title"><span class="dot" style="background:#ff6b8a"></span> Career Portals</div>
        </div>
        <div class="grid" id="careerGrid"></div>
      </div>

      <!-- Social -->
      <div class="section">
        <div class="section-header">
          <div class="section-title"><span class="dot" style="background:#fc9d4f"></span> Social & Entertainment</div>
        </div>
        <div class="grid" id="socialGrid"></div>
      </div>

    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">

      <!-- Clock -->
      <div class="sidebar-card">
        <div class="clock-wrap">
          <div class="clock" id="clock">00:00:00</div>
          <div class="date-str" id="dateStr"></div>
        </div>
      </div>

      <!-- Stats -->
      <div class="sidebar-card">
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-num" id="sitesCount">0</div>
            <div class="stat-label">Sites</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="tasksCount">0</div>
            <div class="stat-label">Tasks</div>
          </div>
        </div>
      </div>

      <!-- Tasks -->
      <div class="sidebar-card">
        <div class="sidebar-title">📝 Tasks</div>
        <div class="task-input-wrap">
          <input type="text" id="taskInput" placeholder="Add a task…" onkeypress="if(event.key==='Enter') addTask()">
          <button class="task-add-btn" onclick="addTask()">+</button>
        </div>
        <div id="taskList"></div>
      </div>

    </div>
  </div>

  <script>
    // ---- THEME ----
    let isLight = false;
    function toggleTheme() {
      isLight = !isLight;
      document.body.classList.toggle("light", isLight);
      document.getElementById("themeIcon").textContent = isLight ? "🌙" : "☀️";
      document.getElementById("themeLabel").textContent = isLight ? "Dark" : "Light";
    }

    // ---- CLOCK ----
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      document.getElementById("clock").textContent = `${h}:${m}:${s}`;
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      document.getElementById("dateStr").textContent =
        `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()} ${now.getFullYear()}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ---- BUILTIN SITES ----
    const builtinSections = {
      aiGrid: [
        { name: "Google", url: "https://google.com" },
        { name: "Gemini", url: "https://gemini.google.com" },
        { name: "DeepSeek", url: "https://chat.deepseek.com" },
        { name: "ChatGPT", url: "https://chat.openai.com" },
        { name: "Emergent AI", url: "https://app.emergent.sh" },
      ],
      devGrid: [
        { name: "GitHub", url: "https://github.com" },
        { name: "HuggingFace", url: "https://huggingface.co" },
        { name: "YouTube", url: "https://youtube.com" },
      ],
      learnGrid: [
        { name: "AICTE Internship", url: "https://internship.aicte-india.org" },
        { name: "Skill India", url: "https://skillindia.gov.in" },
        { name: "Google Arcade", url: "https://go.cloudskillsboost.google/arcade" },
      ],
      careerGrid: [
        { name: "IBM SkillsBuild", url: "https://skillsbuild.org" },
        { name: "Amazon Jobs", url: "https://www.amazon.jobs" },
        { name: "Google Careers", url: "https://careers.google.com" },
        { name: "Meta Careers", url: "https://www.metacareers.com" },
      ],
      socialGrid: [
        { name: "Instagram", url: "https://instagram.com" },
        { name: "Facebook", url: "https://facebook.com" },
        { name: "Netflix", url: "https://netflix.com" },
      ],
    };

    function getDomain(u) { try { return new URL(u).hostname; } catch { return ""; } }
    function favicon(domain) { return `https://www.google.com/s2/favicons?sz=64&domain=${domain}`; }

    function makeCard(page, onRemove) {
      const div = document.createElement("div");
      div.className = "card";
      div.onclick = () => window.open(page.url, "_blank");
      const img = document.createElement("img");
      img.src = favicon(getDomain(page.url));
      img.alt = page.name;
      const name = document.createElement("div");
      name.className = "card-name";
      name.textContent = page.name;
      if (onRemove) {
        const btn = document.createElement("button");
        btn.className = "remove-btn";
        btn.textContent = "×";
        btn.onclick = e => { e.stopPropagation(); onRemove(); };
        div.appendChild(btn);
      }
      div.appendChild(img);
      div.appendChild(name);
      return div;
    }

    function renderBuiltins() {
      let total = 0;
      for (const [id, pages] of Object.entries(builtinSections)) {
        const grid = document.getElementById(id);
        grid.innerHTML = "";
        pages.forEach(p => grid.appendChild(makeCard(p, null)));
        total += pages.length;
      }
      return total;
    }

    // ---- CUSTOM ----
    let customPages = JSON.parse(localStorage.getItem("customPages") || "[]");

    function renderCustom() {
      const grid = document.getElementById("customGrid");
      const sec = document.getElementById("customSection");
      grid.innerHTML = "";
      if (!customPages.length) { sec.style.display = "none"; return; }
      sec.style.display = "block";
      customPages.forEach((p, i) => {
        grid.appendChild(makeCard(p, () => {
          customPages.splice(i, 1);
          localStorage.setItem("customPages", JSON.stringify(customPages));
          renderCustom();
          updateStats();
        }));
      });
    }

    function addWebpage() {
      const name = prompt("Site name:");
      const url = prompt("URL (include https://):");
      if (name && url) {
        customPages.push({ name, url });
        localStorage.setItem("customPages", JSON.stringify(customPages));
        renderCustom();
        updateStats();
      }
    }

    // ---- TASKS ----
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

    function renderTasks() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";
      tasks.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "task-item";
        const chk = document.createElement("div");
        chk.className = "task-check" + (t.done ? " done" : "");
        chk.onclick = () => { tasks[i].done = !tasks[i].done; save(); renderTasks(); updateStats(); };
        const span = document.createElement("span");
        span.className = "task-text" + (t.done ? " done" : "");
        span.textContent = typeof t === "string" ? t : t.text;
        const del = document.createElement("button");
        del.className = "task-del";
        del.textContent = "×";
        del.onclick = () => { tasks.splice(i, 1); save(); renderTasks(); updateStats(); };
        div.appendChild(chk);
        div.appendChild(span);
        div.appendChild(del);
        list.appendChild(div);
      });
    }

    function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); }

    function addTask() {
      const inp = document.getElementById("taskInput");
      if (inp.value.trim()) {
        tasks.push({ text: inp.value.trim(), done: false });
        inp.value = "";
        save();
        renderTasks();
        updateStats();
      }
    }

    function updateStats() {
      const builtinCount = Object.values(builtinSections).reduce((a, b) => a + b.length, 0);
      document.getElementById("sitesCount").textContent = builtinCount + customPages.length;
      document.getElementById("tasksCount").textContent = tasks.length;
    }

    // Migrate old string tasks
    tasks = tasks.map(t => typeof t === "string" ? { text: t, done: false } : t);

    renderBuiltins();
    renderCustom();
    renderTasks();
    updateStats();
  </script>
</body>
</html>
